services:
  postgres:
    image: postgres:17-bookworm
    container_name: top100-postgres
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    environment:
      POSTGRES_USER: top100
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: top100

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U top100 -d top100"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  top100:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: top-100-albums
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:3004:3000"

    environment:
      DATABASE_URL: "postgresql://top100:${POSTGRES_PASSWORD}@postgres:5432/top100?schema=public"
      MUSICBRAINZ_USER_AGENT: "Top100Albums/1.0 (https://top100.rkrp.co.uk)"
      TMDB_READ_ACCESS_TOKEN: "${TMDB_READ_ACCESS_TOKEN}"
      NODE_ENV: "production"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/albums').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data: